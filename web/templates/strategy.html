<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>策略状态 · Curs</title>
  {% include '_curs_head.html' %}
  <script src="{{ url_for('static', filename='strategy-status.js', v=1) }}" defer></script>
</head>
<body class="curs-page">
  {% set active = 'manage' %}
  {% include '_curs_nav.html' %}
  <main class="curs-shell">
    <h1>策略状态</h1>
    <p>查看引擎已加载的策略和最新记录。当前运行模式为仅信号。</p>
    <section class="curs-panel">
      <h2>引擎与策略</h2>
      <p id="strategy-engine" role="status">正在检查引擎…</p>
      <label for="strategy-choice">已加载的策略</label>
      <select id="strategy-choice" disabled></select>
    </section>
    <section class="curs-panel">
      <h2>最近触发</h2>
      <p id="strategy-signal-status" role="status">请选择策略。</p>
      <a id="strategy-signals-link" hidden>查看该策略的机会列表</a>
      <div class="curs-table-wrap" tabindex="0" role="region" aria-label="策略触发记录">
        <table>
          <thead><tr><th>北京时间</th><th>股票名称 / 代码</th><th>方向</th><th>参考价格</th></tr></thead>
          <tbody id="strategy-signals"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
