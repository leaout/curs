name: 手动归档热股榜

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: 采集热点股票
        run: |
          python data_collection/collect_to_file.py
        env:
          WHATSHOT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: 提交采集结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/collected/
          if ! git diff --staged --quiet; then
            DATE=$(date --iso-8601)
            git commit -m "chore: daily data collection ${DATE}"
            git push
          else
            echo "无数据变更，跳过提交"
          fi
